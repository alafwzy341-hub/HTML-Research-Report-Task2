<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" role="img" aria-label="مطور مبتدئ ومساعد ذكاء اصطناعي يشرح له الكود" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0B1F33"/><stop offset="1" stop-color="#1D4A7A"/></linearGradient>
<linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4F5BD5"/><stop offset="1" stop-color="#35D0C0"/></linearGradient></defs>
<style>.m{font-family:Consolas,Menlo,monospace;font-size:17px}.s{transform-origin:400px 120px;animation:r 12s linear infinite}@keyframes r{to{transform:rotate(360deg)}}@media (prefers-reduced-motion:reduce){.s{animation:none}}</style>
<rect width="800" height="440" rx="26" fill="url(#bg)"/>
<!-- laptop -->
<rect x="70" y="170" width="380" height="210" rx="14" fill="#0A1626" stroke="#3A6592" stroke-width="3"/>
<rect x="40" y="380" width="440" height="18" rx="9" fill="#3A6592"/>
<g class="m"><text x="95" y="212" fill="#7FB4FF">&lt;h1&gt;</text><text x="165" y="212" fill="#E8EEF6">عنواني</text><text x="245" y="212" fill="#7FB4FF">&lt;/h1&gt;</text>
<text x="95" y="248" fill="#7FB4FF">&lt;img <tspan fill="#35D0C0">src</tspan>=<tspan fill="#F5B84B">"a.png"</tspan>&gt;</text>
<text x="95" y="284" fill="#FF8A8A">&lt;p&gt; ... (خطأ: الوسم غير مغلق)</text>
<text x="95" y="320" fill="#7FB4FF">&lt;a <tspan fill="#35D0C0">href</tspan>=<tspan fill="#F5B84B">"#"</tspan>&gt;</text></g>
<rect x="85" y="262" width="350" height="34" rx="8" fill="#E5484D" opacity=".16"/>
<!-- AI core -->
<g class="s"><circle cx="400" cy="120" r="46" fill="none" stroke="#35D0C0" stroke-dasharray="6 10" stroke-width="3"/></g>
<circle cx="400" cy="120" r="34" fill="url(#g)"/>
<path d="M400 98l6 16 16 6-16 6-6 16-6-16-16-6 16-6z" fill="#fff"/>
<text x="400" y="196" font-family="Tahoma,Arial,sans-serif" font-size="17" fill="#9FE9E1" text-anchor="middle" direction="rtl">مساعد ذكاء اصطناعي</text>
<!-- bubbles -->
<rect x="500" y="60" width="260" height="90" rx="16" fill="#F4F7FB"/>
<text x="740" y="95" font-family="Tahoma,Arial,sans-serif" font-size="17" fill="#1B2B3C" text-anchor="end" direction="rtl">لماذا الصفحة لا تظهر</text>
<text x="740" y="125" font-family="Tahoma,Arial,sans-serif" font-size="17" fill="#1B2B3C" text-anchor="end" direction="rtl">بشكل صحيح؟</text>
<rect x="500" y="190" width="260" height="130" rx="16" fill="url(#g)"/>
<text x="740" y="225" font-family="Tahoma,Arial,sans-serif" font-size="17" fill="#fff" text-anchor="end" direction="rtl">الوسم &lt;p&gt; ناقصه وسم إغلاق.</text>
<text x="740" y="255" font-family="Tahoma,Arial,sans-serif" font-size="17" fill="#fff" text-anchor="end" direction="rtl">أضف &lt;/p&gt; في نهاية الفقرة،</text>
<text x="740" y="285" font-family="Tahoma,Arial,sans-serif" font-size="17" fill="#fff" text-anchor="end" direction="rtl">ثم جرّب مرة أخرى.</text>
<g font-family="Tahoma,Arial,sans-serif" font-size="16" font-weight="700"><rect x="520" y="345" width="70" height="34" rx="17" fill="#E34F26"/><text x="555" y="368" fill="#fff" text-anchor="middle">HTML</text>
<rect x="602" y="345" width="70" height="34" rx="17" fill="#2965F1"/><text x="637" y="368" fill="#fff" text-anchor="middle">CSS</text>
<rect x="684" y="345" width="76" height="34" rx="17" fill="#F5B84B"/><text x="722" y="368" fill="#0B1F33" text-anchor="middle">JS</text></g>
</svg>