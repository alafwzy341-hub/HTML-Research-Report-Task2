<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" role="img" aria-label="ثلاثة مستويات للذكاء الاصطناعي" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="a" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4F5BD5"/><stop offset="1" stop-color="#3441B0"/></linearGradient>
    <linearGradient id="b" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#35D0C0"/><stop offset="1" stop-color="#1E9E92"/></linearGradient>
  </defs>
  <style>.t{font-family:Tahoma,Arial,sans-serif}</style>
  <rect width="800" height="380" rx="24" fill="#EEF3F9"/>
  <line x1="40" y1="320" x2="760" y2="320" stroke="#B9C7D9" stroke-width="2"/>
  <!-- RTL: ANI on right -->
  <rect x="540" y="200" width="190" height="120" rx="12" fill="url(#a)"/>
  <text x="635" y="252" class="t" font-size="34" font-weight="700" fill="#fff" text-anchor="middle">ANI</text>
  <text x="635" y="285" class="t" font-size="17" fill="#E6EAFF" text-anchor="middle" direction="rtl">ذكاء ضيق</text>
  <rect x="305" y="130" width="190" height="190" rx="12" fill="url(#b)"/>
  <text x="400" y="222" class="t" font-size="34" font-weight="700" fill="#fff" text-anchor="middle">AGI</text>
  <text x="400" y="255" class="t" font-size="17" fill="#EFFFFC" text-anchor="middle" direction="rtl">ذكاء عام</text>
  <rect x="70" y="60" width="190" height="260" rx="12" fill="none" stroke="#12304F" stroke-width="3" stroke-dasharray="9 7"/>
  <text x="165" y="190" class="t" font-size="34" font-weight="700" fill="#12304F" text-anchor="middle">ASI</text>
  <text x="165" y="223" class="t" font-size="17" fill="#12304F" text-anchor="middle" direction="rtl">ذكاء فائق (نظري)</text>
  <text x="635" y="188" class="t" font-size="15" fill="#4F5BD5" text-anchor="middle" direction="rtl">موجود اليوم</text>
  <text x="400" y="118" class="t" font-size="15" fill="#1E9E92" text-anchor="middle" direction="rtl">هدف بحثي</text>
  <text x="165" y="48" class="t" font-size="15" fill="#12304F" text-anchor="middle" direction="rtl">حتى الآن نظري</text>
</svg>
