<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" role="img" aria-label="محرر أكواد ومحادثة مع مساعد ذكاء اصطناعي" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4F5BD5"/><stop offset="1" stop-color="#35D0C0"/>
    </linearGradient>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#14365A"/><stop offset="1" stop-color="#0B1F33"/>
    </linearGradient>
  </defs>
  <style>
    .m{font-family:Consolas,Menlo,monospace;font-size:19px}
    .a{font-family:Tahoma,Arial,sans-serif;font-size:19px}
    .cur{animation:b 1s steps(2) infinite}
    @keyframes b{50%{opacity:0}}
    .float{animation:f 6s ease-in-out infinite}
    @keyframes f{50%{transform:translateY(-8px)}}
    @media (prefers-reduced-motion:reduce){.cur,.float{animation:none}}
  </style>
  <rect width="800" height="560" rx="28" fill="url(#bg)"/>
  <circle cx="700" cy="70" r="150" fill="#4F5BD5" opacity=".18"/>
  <circle cx="90" cy="500" r="130" fill="#35D0C0" opacity=".14"/>

  <!-- code editor -->
  <g>
    <rect x="40" y="40" width="520" height="320" rx="16" fill="#0A1626" stroke="#2A4A70"/>
    <rect x="40" y="40" width="520" height="44" rx="16" fill="#12304F"/>
    <rect x="40" y="68" width="520" height="16" fill="#12304F"/>
    <circle cx="68" cy="62" r="7" fill="#FF6B6B"/><circle cx="92" cy="62" r="7" fill="#F5B84B"/><circle cx="116" cy="62" r="7" fill="#35D0C0"/>
    <text x="300" y="68" class="m" font-size="15" fill="#8FA7C2">index.html</text>
    <g class="m">
      <text x="64" y="120" fill="#6F86A3">1</text><text x="100" y="120" fill="#7FB4FF">&lt;html lang="ar" dir="rtl"&gt;</text>
      <text x="64" y="152" fill="#6F86A3">2</text><text x="120" y="152" fill="#7FB4FF">&lt;body&gt;</text>
      <text x="64" y="184" fill="#6F86A3">3</text><text x="140" y="184" fill="#7FB4FF">&lt;h1&gt;<tspan fill="#E8EEF6">الذكاء التوليدي</tspan>&lt;/h1&gt;</text>
      <text x="64" y="216" fill="#6F86A3">4</text><text x="140" y="216" fill="#7FB4FF">&lt;img <tspan fill="#35D0C0">src</tspan><tspan fill="#E8EEF6">=</tspan><tspan fill="#F5B84B">"hero.svg"</tspan>&gt;</text>
      <text x="64" y="248" fill="#6F86A3">5</text><text x="140" y="248" fill="#7FB4FF">&lt;table&gt;</text>
      <text x="64" y="280" fill="#6F86A3">6</text><text x="140" y="280" fill="#7FB4FF">&lt;a <tspan fill="#35D0C0">href</tspan><tspan fill="#E8EEF6">=</tspan><tspan fill="#F5B84B">"..."</tspan>&gt;</text>
      <text x="64" y="312" fill="#6F86A3">7</text><text x="120" y="312" fill="#7FB4FF">&lt;/body&gt;</text>
      <rect class="cur" x="258" y="296" width="10" height="22" fill="#35D0C0"/>
    </g>
  </g>

  <!-- chat -->
  <g class="float">
    <rect x="300" y="300" width="460" height="220" rx="20" fill="#F4F7FB"/>
    <rect x="330" y="322" width="400" height="48" rx="14" fill="#DCE5F2"/>
    <text x="712" y="353" class="a" fill="#1B2B3C" text-anchor="end" direction="rtl">ما وظيفة وسم &lt;img&gt; ؟</text>
    <rect x="330" y="386" width="400" height="104" rx="14" fill="url(#g)"/>
    <text x="712" y="422" class="a" fill="#fff" text-anchor="end" direction="rtl">يعرض صورة داخل الصفحة، ويحتاج</text>
    <text x="712" y="452" class="a" fill="#fff" text-anchor="end" direction="rtl">إلى المسار src والنص البديل alt.</text>
    <circle cx="352" cy="408" r="0" fill="#fff"/>
  </g>
  <g transform="translate(70 395)">
    <rect width="190" height="110" rx="16" fill="#12304F" stroke="#2A4A70"/>
    <text x="95" y="48" class="a" font-size="17" fill="#35D0C0" text-anchor="middle" direction="rtl">مساعد للمطور</text>
    <text x="95" y="78" class="a" font-size="15" fill="#8FA7C2" text-anchor="middle" direction="rtl">لا يغني عن الفهم</text>
  </g>
</svg>
